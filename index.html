<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Scripture Daily — Daily Bible Reading with Horner's System</title>
    <meta name="title" content="Scripture Daily — Daily Bible Reading with Horner's System" />
    <meta name="description" content="A quiet companion for disciplined, lifelong engagement with God's Word. Track your daily Bible reading with Professor Horner's proven 10-list system." />
    <meta name="author" content="Scripture Daily" />
    <meta name="keywords" content="Bible reading, Horner reading plan, daily devotional, scripture tracker, Bible study, 10-list system, Bible app" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scripturedaily.app/" />
    <meta property="og:title" content="Scripture Daily — Daily Bible Reading with Horner's System" />
    <meta property="og:description" content="A quiet companion for disciplined, lifelong engagement with God's Word. Read 10 chapters daily with the proven Horner reading system." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:site_name" content="Scripture Daily" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://scripturedaily.app/" />
    <meta name="twitter:title" content="Scripture Daily — Daily Bible Reading" />
    <meta name="twitter:description" content="Track your daily Bible reading with Professor Horner's 10-list system. Build a lifelong habit of engaging with Scripture." />
    <meta name="twitter:image" content="/icon-512.png" />
    
    <!-- PWA & Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scripture Daily" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Single tag, updated at runtime by SettingsProvider to match the resolved theme. -->
    <meta name="theme-color" content="#faf8f5" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://scripturedaily.app/" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Scripture Daily",
      "description": "A quiet companion for disciplined, lifelong engagement with God's Word using Professor Horner's 10-list Bible reading system.",
      "url": "https://scripturedaily.app",
      "applicationCategory": "ReligionApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Scripture Daily"
      }
    }
    </script>

    <!--
      Applies the saved theme before first paint.

      React applies the theme in an effect, which runs after the browser has
      already painted the default light background — producing a white flash on
      every cold load for dark-mode users. This blocking inline script runs
      before the body renders and closes that gap. It is deliberately tiny and
      failure-tolerant: any error falls through to the light default.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("scripture-daily-settings-v1");
          var theme = stored ? JSON.parse(stored).theme : "system";
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = "#0f1019";
          }
        } catch (e) {
          /* Light theme is the default; nothing to do. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        Scripture Daily needs JavaScript to track your reading. Please enable it
        and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
