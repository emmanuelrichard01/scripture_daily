name: Send reading reminders

# Hourly, because the handler decides whose *local* reminder hour it currently
# is — one schedule covers every timezone. This lives here rather than in
# vercel.json because Vercel's Hobby plan caps cron jobs at one run per day,
# which would mean only users in a single timezone ever got reminded.
#
# GitHub's scheduler can drift by several minutes under load; for a daily
# reading nudge that is immaterial. It also pauses scheduled workflows after
# 60 days without repository activity, so re-enable it if the repo goes quiet.
on:
  schedule:
    - cron: "0 * * * *"
  # Lets you fire a reminder run by hand to check the wiring.
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  dispatch:
    name: Trigger the reminder endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "::error::PRODUCTION_URL variable is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

          # Separate the body from the status code so both can be reported.
          response="$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --write-out '\n%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_URL%/}/api/cron")" || true

          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          echo "status: ${status}"
          echo "body:   ${body}"

          if [ "$status" != "200" ]; then
            echo "::error::Reminder dispatch failed with HTTP ${status}"
            exit 1
          fi

          echo "::notice::${body}"
